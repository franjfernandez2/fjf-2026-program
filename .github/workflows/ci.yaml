# Continuous integration for the FJF-2026 programme.
#
# Runs on every pull request (whatever its base branch, so stacked pull requests are
# checked too) and on every push to main. It uses exactly the same Docker image and
# Compose stack as local work, so "it passes in CI" means "it passes on any machine".
#
# Steps: build the analysis image (with layer cache) -> restore the cached pilot data ->
#        start PostgreSQL -> lockfile check -> lint and format checks -> test suite ->
#        full pipeline (downloads and verifies the pilot data on a cache miss) -> documents.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run still in progress, to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the analysis image (cached between runs)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fjf-2026-analysis:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The CI database lives only for this run, so its credentials are random and
      # thrown away. No repository secrets are needed.
      - name: Create throwaway credentials
        run: |
          umask 077
          {
            echo "POSTGRES_DB=fjf2026"
            echo "POSTGRES_USER=fjf_admin"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "FJF_LOADER_PASSWORD=$(openssl rand -hex 16)"
            echo "FJF_READER_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      # Third-party benchmark data (ADR 0015). The key is the manifest's hash, so the cache is
      # reused until the pinned files change. On a miss the pipeline downloads and verifies them.
      - name: Restore the CDISC pilot files
        uses: actions/cache@v4
        with:
          path: data/external/cdiscpilot01
          key: cdiscpilot01-${{ hashFiles('data/external/cdiscpilot01-manifest.csv') }}

      - name: Start the clinical database
        run: docker compose up -d --wait db

      # Fails if the code uses a package that renv.lock does not record, or vice versa.
      - name: Lockfile in sync with the code
        run: docker compose run --rm -T --no-deps analysis Rscript -e 'stopifnot(renv::status()$synchronized)'

      - name: Lint and format checks
        run: docker compose run --rm -T analysis Rscript tests/check-style.R

      - name: Test suite
        run: docker compose run --rm -T analysis Rscript tests/run-tests.R

      - name: Pipeline
        run: docker compose run --rm -T analysis Rscript -e 'targets::tar_make(reporter = "verbose")'

      # Some tests read the pipeline's results (e.g. every benchmark finding must be explained,
      # ADR 0017). Before the pipeline has run they are skipped, so the suite runs again here.
      - name: Test suite on the pipeline's results
        run: docker compose run --rm -T analysis Rscript tests/run-tests.R

      - name: Render document templates (HTML and PDF), notes, design documents, protocols and the benchmark report
        run: >-
          docker compose run --rm -T --no-deps analysis bash -c
          'cd docs/templates && quarto render && cd ../notes && quarto render
          && cd ../design && quarto render && cd ../protocols && quarto render
          && cd ../../studies/benchmark/report && quarto render'

      - name: Database logs (only if something failed)
        if: failure()
        run: docker compose logs db

      - name: Stop and remove the stack
        if: always()
        run: docker compose down -v
