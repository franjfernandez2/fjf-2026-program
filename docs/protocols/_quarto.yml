# Protocol synopses of the FJF-2026 studies (same settings as docs/templates).
#   quarto render docs/protocols

project:
  type: default
  output-dir: _output

lang: en-GB
date-format: "D MMMM YYYY"
toc: true
number-sections: true

format:
  html:
    embed-resources: true
    theme: cosmo
    fontsize: 1rem
    include-before-body:
      text: |
        <div class="callout callout-style-simple callout-warning" role="note">
        <div class="callout-body"><strong>Simulated data · fictional compound.</strong>
        FJF-2026 does not exist. Every number in this document is generated by code.</div></div>
  typst:
    papersize: a4
    margin:
      x: 2.2cm
      y: 2.4cm
    fontsize: 10.5pt
    include-before-body:
      text: |
        #block(fill: rgb("#fff4e5"), inset: 8pt, radius: 4pt, width: 100%)[*Simulated data · fictional compound.* FJF-2026 does not exist. Every number in this document is generated by code.]

execute:
  echo: false
  warning: false
