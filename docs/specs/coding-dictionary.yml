# Reduced coding dictionary of the FJF-2026 programme. MedDRA and WHODrug need a licence,
# so this file is the project's own: it uses the structure of MedDRA (lowest level term,
# preferred term, system organ class) and the ATC classification for medications, but no
# MedDRA or WHODrug codes. The reviewer's guide says so. Verbatim terms are matched without
# case and surrounding blanks; a term that is not here stops the SDTM build, as an uncoded
# term would raise a query in a real study.

