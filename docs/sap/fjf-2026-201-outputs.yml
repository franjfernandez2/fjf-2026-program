# Tables and figures of FJF-2026-201, and their traceability to its SAP (fjf-2026-201-sap.yml).
# Each output names the SAP item it implements, the ADaM variables it reads and the program
# that makes it. R/outputs.R checks that every SAP item has an output, and every output a SAP
# item. Written in F4 on blinded data, before the database lock (ADR 0031). The patient and
# safety outputs are those of FJF-2026-301 with the five arms in columns, highest dose first.

study: FJF-2026-201
adam_datasets: [ADSL, ADEFF, ADTTE, ADAE, ADHYPO, ADLB, ADVS, ADEX]

outputs:
  # --- Patients ---
  - id: T-14.1.1
    type: table
    title: Disposition of patients
    population: FAS
    sap: [FAS, SAF]
    adam: [ADSL.RANDFL, ADSL.SAFFL, ADSL.EOTSTT, ADSL.DCTREAS, ADSL.EOSSTT, ADSL.DCSREAS]
    program: studies/201/tlf/t_14_1_1.R
    layout: As T-14.1.1 of FJF-2026-301, without the per-protocol set (none in this SAP).
  - id: T-14.1.2
    type: table
    title: Demographic and baseline characteristics
    population: FAS
    sap: [FAS]
    adam: [ADSL.AGE, ADSL.AGEGR1, ADSL.SEX, ADSL.RACE, ADSL.BMIBL, ADSL.WEIGHTBL, ADSL.HBA1CBL, ADSL.STRATAR]
    program: studies/201/tlf/t_14_1_2.R
    layout: Arms in columns, total last. n, mean (SD), median, min-max; n (%).

  # --- Dose-response ---
  - id: T-14.2.1
    type: table
    title: Change from baseline in HbA1c at week 12 by dose, hypothetical estimand
    population: FAS
    sap: [A1]
    adam: [ADEFF.PARAMCD, ADEFF.AVISIT, ADEFF.BASE, ADEFF.CHG, ADEFF.ONTRTFL, ADEFF.PRERESFL, ADSL.TRT01P]
    program: studies/201/tlf/t_14_2_1.R
    layout: >-
      Arms in columns. Observed n, mean (SD) at baseline and change at week 12 (on treatment,
      before rescue); MMRM mean change (SE) and difference from placebo (95% CI).
  - id: T-14.2.2
    type: table
    title: Dose-response of HbA1c at week 12, MCP-Mod
    population: FAS
    sap: [A1, S1, S2]
    adam: [ADEFF.CHG, ADEFF.AVISIT, ADEFF.ONTRTFL, ADEFF.PRERESFL, ADSL.TRT01P]
    program: studies/201/tlf/t_14_2_2.R
    layout: >-
      Columns A1, S1 (model averaging) and S2 (all observed values). MCP step: contrast test
      statistic and adjusted p-value per candidate model, signal. Mod step: selected model and
      its gAIC, fitted effect against placebo per dose, target dose.
  - id: F-14.2.1
    type: figure
    title: Dose-response of HbA1c at week 12
    population: FAS
    sap: [A1, S1]
    adam: [ADEFF.CHG, ADEFF.AVISIT, ADSL.TRT01P]
    program: studies/201/tlf/f_14_2_1.R
    layout: >-
      MMRM difference from placebo (95% CI) at each dose, with the fitted effects of the
      selected model (A1) and of model averaging (S1); the clinical relevance line.
  - id: T-14.2.3
    type: table
    title: Clinical utility index by dose
    population: SAF
    sap: [X1]
    adam: [ADAE.TRTEMFL, ADAE.AEACN, ADSL.SAFFL, ADSL.TRT01AN]
    program: studies/201/tlf/t_14_2_3.R
    layout: >-
      One row per dose: HbA1c effect against placebo, patients with an adverse event leading
      to discontinuation n/N (%), the two scaled utilities and the index.

  # --- Safety ---
  - id: T-14.3.1
    type: table
    title: Overview of treatment-emergent adverse events
    population: SAF
    sap: [SF1]
    adam: [ADAE.TRTEMFL, ADAE.AESER, ADAE.AEACN, ADAE.AEOUT, ADSL.TRT01A]
    program: studies/201/tlf/t_14_3_1.R
    layout: As T-14.3.1 of FJF-2026-301.
  - id: T-14.3.2
    type: table
    title: Treatment-emergent adverse events by system organ class and preferred term
    population: SAF
    sap: [SF1]
    adam: [ADAE.AEBODSYS, ADAE.AEDECOD, ADAE.TRTEMFL, ADSL.TRT01A, ADEX.TRTDURY]
    program: studies/201/tlf/t_14_3_2.R
    layout: As T-14.3.2 of FJF-2026-301, sorted by frequency on the highest dose.
  - id: T-14.3.3
    type: table
    title: Hypoglycaemia by level
    population: SAF
    sap: [SF1]
    adam: [ADHYPO.HYPOLVL, ADHYPO.ONTRTFL, ADHYPO.PRERESFL, ADSL.TRT01A, ADEX.TRTDURY]
    program: studies/201/tlf/t_14_3_3.R
    layout: As T-14.3.3 of FJF-2026-301.
  - id: F-14.3.1
    type: figure
    title: Kaplan-Meier curves of the time to first level 2 or 3 hypoglycaemia
    population: SAF
    sap: [SF1]
    adam: [ADTTE.PARAMCD, ADTTE.AVAL, ADTTE.CNSR, ADSL.TRT01A]
    program: studies/201/tlf/f_14_3_1.R
    layout: As F-14.3.1 of FJF-2026-301.
  - id: T-14.3.4
    type: table
    title: Laboratory shifts from baseline to the worst value on treatment
    population: SAF
    sap: [SF1]
    adam: [ADLB.PARAMCD, ADLB.BNRIND, ADLB.ANRIND, ADLB.WORSTFL, ADSL.TRT01A]
    program: studies/201/tlf/t_14_3_4.R
    layout: As T-14.3.4 of FJF-2026-301.
  - id: F-14.3.2
    type: figure
    title: eDISH plot of peak ALT against peak total bilirubin
    population: SAF
    sap: [SF1]
    adam: [ADLB.PARAMCD, ADLB.AVAL, ADLB.ANRHI, ADSL.TRT01A]
    program: studies/201/tlf/f_14_3_2.R
    layout: As F-14.3.2 of FJF-2026-301.
  - id: T-14.3.5
    type: table
    title: Vital signs and body weight, change from baseline
    population: SAF
    sap: [SF1]
    adam: [ADVS.PARAMCD, ADVS.AVISIT, ADVS.BASE, ADVS.CHG, ADSL.TRT01A]
    program: studies/201/tlf/t_14_3_5.R
    layout: As T-14.3.5 of FJF-2026-301.
  - id: T-14.3.6
    type: table
    title: Exposure to study drug
    population: SAF
    sap: [SF1]
    adam: [ADEX.TRTDURD, ADEX.TRTDURY, ADEX.COMPLPCT, ADSL.TRT01A]
    program: studies/201/tlf/t_14_3_6.R
    layout: As T-14.3.6 of FJF-2026-301.
